[build-system]
#: ⛔ 构建后端只用 setuptools（Python 生态里最普及的那个）。
#:    我们**不引入任何运行期依赖**（stdlib only），所以这里也不该
#:    顺手引入 hatchling/poetry 之类"只是因为流行"的后端 ——
#:    那会让"零依赖"这条承诺在**打包阶段**就失效。
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-v6"
#: ⛔ 版本号**唯一事实源**是 `aether/_version.py`，这里用 dynamic 从包读，
#:    不写第二份（此前 `__init__.py` 与 `serve.py` 各写一份，实测漂移过）。
dynamic = ["version"]
description = "V6 · AETHER —— 可验证的自进化智能体骨架（每一次自我修改都必须能被独立地证伪、回放和撤销）"
requires-python = ">=3.9"
#: ⛔ **零运行期依赖**不是洁癖：自进化系统的判据必须离线可回归 ——
#:    一旦依赖网络或模型，"零新红""非回归"这些判据就会随供给波动而失效
#:    （V5 实测：链首供应商 82% 429，整条供给链废掉两轮）。
#:    这条留空是**刻意的**，改动它等于改判据（见 README §4）。
dependencies = []
readme = "README.md"
#: ⛔ 授权是**人的决定**：这里用的是最宽松的常见默认（MIT），
#:    LICENSE 文件里那行版权持有人必须由仓库所有者自己填。
#:    要换授权 ⇒ 同时改 LICENSE 与这里（两处不一致会被
#:    `tests/contract_packaging_test.py` 抓到）。
license = { file = "LICENSE" }
keywords = ["self-improving", "agent", "verifiable", "ledger", "rlvr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]
#: ⛔ 控制台脚本只是**转发**到同一份命令表（`aether.cli`），
#:    不在这里再写一条命令清单。
[project.scripts]
aether = "aether.cli:main"

[project.optional-dependencies]
#: 刻意留空：dev 工具一律走 stdlib（见 `aether/check.py` 与
#: `scripts/`）。要接 ruff/mypy 时在**这里**声明，别偷偷 import。
dev = []

[tool.setuptools]
packages = ["aether"]
#: ⛔ 必须 **false**（r61 实测）：`aether/seeds/tasks` 是指向仓库 `tasks/` 的
#:    符号链接，而 `include-package-data = true` 会把链接下**所有**文件都
#:    收进去 —— 实测 wheel 里有 43 个文件（28 个真文件 + 各环境
#:    `__pycache__/*.pyc` + 运行产物 `_worldgen_report.json`）。
#:    发货 `__pycache__` 不只是脏：它会让"装出来的包"里混进**编译时**的
#:    字节码，与源码是否一致无从判别。
#:    ⇒ 改成只认下面 `package-data` 里**逐个点名**的那几个 glob。
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "aether._version.CODE_VERSION" }

[tool.setuptools.package-data]
#: ⛔ 只带**包内**的文件。`tasks/` / `console/` / `supervisor/` 在仓库根，
#:    它们是"这个仓库的资产"而不是"这个包的资源" —— 直接打进 wheel 会让
#:    仓库里出现**两份**（改了仓库那份却没生效 = 两个事实源）。
#:
#: ⛔ r61 增补：`aether/seeds/tasks`、`aether/seeds/console` 都是**符号链接**，
#:    分别指向仓库根的 `tasks/` 与 `console/`。这么做是为了**同时**满足
#:    两件互相拉扯的事：
#:      · 仓库里只能有**一份**（复制一份 = 两个事实源，改一处漏一处）；
#:      · 装成 wheel 之后必须**有**（否则 `synth`/`evolve`/`ui` 装完即废 ——
#:        实测算过：wheel 里 46 个 .py、tasks/ 一个都没进去；控制台则是
#:        `aether ui` 起来直接死在「找不到控制台页面」，而 API 是好的）。
#:    实测：setuptools 构建时会**跟随**符号链接、把真实文件写进 wheel
#:    ⇒ 仓库零重复，安装物是真快照。读取侧由 `paths.console_dir()` /
#:    `paths.seeds_dir()` 决定"用哪份"（仓库有多少就用仓库那份）。
#:    ⛔ 只收 `task.py` 与 `tests.json`：`tasks/` 下还有 `_worldgen_report.json`
#:       这类**运行产物**，用 `seeds/**/*` 会把它们一起发货（实测已中招）。
aether = ["py.typed",
          "seeds/tasks/*/task.py",
          "seeds/tasks/*/tests.json",
          #: ⛔ r61 补：控制台页面是**单文件**（index.html，零构建）。它同样是
          #:    仓库资产 ⇒ 不点名叫它，装完之后 `aether ui` 起来就死在
          #:    「找不到控制台页面」（实测装态 rc=1，API 却是好的）。
          #:    ⛔ 不写 `seeds/console/*`：那个目录里有 `.DS_Store`。
          "seeds/console/index.html"]
