# V6 · AETHER 的验收工作流
#
# ⛔ 这个文件的**唯一职责**：把这个仓库的自证链条接到 CI 上。
#    写它之前先问了一句 —— 本地那条命令是什么？
#    答案是 `python -m aether check`（它自己聚合退出码、分五态，并把
#    "跨语言一致性"作为显式一步）。所以 CI **不再自己拼命令序列**：
#    一份判据两处实现就会漂移（"本地绿、CI 红"最典型的成因）。
#
# ⛔ 如实标注一条边界：跨语言那一步需要 Node >= 22。workflow 里装了 Node，
#    所以它会真跑；**没装时是 skip 而不是 pass**（报告里单独点名
#    "跨语言一致性未验证"）。
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        #: ⛔ 3.9 是**实测出来的下限**（22/22 模块在 3.9.6 下都能 import），
        #:    不是"本机恰好是 3.13"。写进矩阵是为了让
        #:    `requires-python = ">=3.9"` 这句声明**有东西在守**。
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          #: ⛔⛔ `fetch-depth: 0` 不是"顺手加的保险"，是 `release` D1 的**取数前提**：
          #:    D1 判的是「存在能锚定当前版本号的 tag」。默认 checkout 只拉
          #:    单个 commit、**不拉 tag** ⇒ `git tag --list` 恒空 ⇒ D1 恒红，
          #:    而红的原因与仓库状态无关（本地明明有 `v0.2.0`）。
          #:    实测：本地全绿、CI 8 红里就有一份是这个。
          #:    ⛔ 也别改成"CI 上跳过 D1"—— 那等于把"发布动作"这条判据
          #:      在唯一真正需要它的地方关掉。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      #: 跨语言监督器要 Node >= 22（见 supervisor/package.json 的 engines）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      #: ⛔ 不装任何第三方包：这个仓库是 stdlib only，而"零依赖"由
      #:    `contract_packaging_test.py` 静态守着 —— 在 CI 里 pip install
      #:    一圈，恰好会把那条判据的意义抹掉。
      - name: 版本与账本格式（入口同源）
        run: python -m aether --version

      #: 全量验收：40+ 份契约 × 两种模式 + 跨语言一致性
      #: ⛔ 输出必须同时落盘（`tee`）：下一步要在失败时把摘要翻成 annotation。
      #:    `pipefail` 不能省 —— 否则 `tee` 的退出码（恒 0）会顶掉 python 的，
      #:    整步变成永远绿（假绿里最难查的一种：步骤绿、结论红）。
      - name: 全量验收（一条命令、一个退出码）
        id: check
        run: |
          set -o pipefail
          python -m aether check -j 2 2>&1 | tee /tmp/check.log

      #: 体检：链 / 出处 / 投影对账 / 记忆完整性 / 备份 / 数据可写
      #: ⛔ 新克隆的仓库没有 data/（运行产物不进版本库）⇒ 直接体检会报
      #:    "账本不存在"，那是**正确**的。这里跑**种子现场**，让
      #:    "克隆下来就能跑"这件事在 CI 里被真正走到。
      - name: 体检（种子现场）
        run: python -m aether --root data/seed doctor || true

      #: 链与出处（种子自带，不依赖任何运行产物）
      - name: 链与出处（种子现场）
        run: |
          python -m aether --root data/seed verify-chain
          python -m aether --root data/seed status > /dev/null

      #: ⛔⛔ 存在的理由是一条实测过的边界：**Actions 的完整日志要认证才能下载**。
      #:    于是"CI 红了"在无凭据的一侧只有一个红叉，看不到是哪份契约、为什么 ——
      #:    红项不可读 ⇒ 只能靠猜 ⇒ 猜出来的结论会写进下一轮（第 133 条的形状：
      #:    零命中先要证明量具能命中，读不到读数时更糟，会直接把猜测当读数）。
      #:    check-run 的 **annotations 是公开可读的**（`/check-runs/{id}/annotations`），
      #:    所以把失败契约逐条用 `::error::` 打出来，等于给 CI 装了个可远程取的读数。
      #:    ⛔ `::error::` 只标 annotation、**不改退出码**：本步已由 `if: failure()`
      #:      进入，退出 0 即可；把它写成"再判一次失败"会让红项数翻倍。
      #:    ⛔ 上限 20 条是刻意的：annotation 有条数上限，列满反而被截断；
      #:      超出的部分由上一行的 `fail=N` 计数承载，不会静默丢失。
      - name: 失败摘要 → check-run annotation
        if: failure()
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path("/tmp/check.log")
          if not log.is_file():
              print("::error::这一步之前就红了（全量验收没产生日志）")
              sys.exit(0)
          lines = log.read_text(errors="replace").splitlines()
          head = next((l for l in lines if l.startswith(("❌", "✅"))), "")
          print("::error::CI 未通过 | " + (head or "日志里没有摘要头 ⇒ 红在 check 之前"))
          fails = [l for l in lines if re.match(r"^\s+❌ \[", l)]
          for l in fails[:20]:
              print("::error::" + l.strip()[:1000])
          print(f"::notice::失败契约 {len(fails)} 条（上面最多列 20 条）")
          PY
